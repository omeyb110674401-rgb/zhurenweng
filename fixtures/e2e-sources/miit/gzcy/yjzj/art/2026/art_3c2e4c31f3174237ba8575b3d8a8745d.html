	<p>根据标准化工作的总体安排，现将申请立项的《饲料加工机械卫生规范》等14项强制性国家标准制修订计划项目予以公示（见附件1）。</p><p><br></p><p>如对拟立项标准项目有不同意见，请在公示期间填写《标准立项反馈意见表》（见附件2）并反馈至我司，电子邮件发送至kjbz@miit.gov.cn（邮件主题注明：强制性国家标准立项公示反馈）。</p><p><br></p><p>公示时间：2026年9月4日—{{CN_DATE-10}}</p><p>联系电话：010-64102958，010-68205261</p><p><br></p><p>附件：1.<a href="https://www.miit.gov.cn/cms_files/filemanager/1226211233/attach/20269/9835b003f6b34a1ca06934bcd0233271.pdf">强制性国家标准制修订计划（征求意见稿）</a></p><p>　　　2.<a href="https://www.miit.gov.cn/cms_files/filemanager/1226211233/attach/20268/c54e3c50fa1241b6bb7f66c2c3071e51.doc">标准立项反馈意见表</a></p><p><br></p>
