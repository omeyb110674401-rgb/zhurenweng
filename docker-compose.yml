# 生产对齐工件（docs/adr/0001-local-dev-without-docker.md）：
# caddy / web / worker / PostgreSQL / Meilisearch 五服务，与 PRD「部署」一致。
#
# 注意：开发机没有 Docker，本文件**在开发机上不可运行**，仅供生产部署对齐。
# 本地开发与测试使用 SQLite + stub（npm run dev / npm run e2e），见 README。
#
# 说明：web 与 worker 启动前都执行 scripts/db-migrate.mjs（drizzle 迁移按
# 迁移表幂等；并发启动由 src/db/client.ts 的 pg_advisory_lock 串行化）。
#
# 说明：对外流量一律经 caddy 终结 TLS（Let's Encrypt 自动签发/续期），web 只在
# 回环地址暴露 3000 供服务器本地排障；db / meilisearch 不对宿主暴露端口。

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      # 站点主域名（DNS A 记录须已指向本机，否则 ACME 校验失败）
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_DRIVER: postgres
      DATABASE_URL: postgres://zhurenweng:${POSTGRES_PASSWORD:?必须在服务器 .env 中设置 POSTGRES_PASSWORD}@db:5432/zhurenweng
      # LLM 与邮件在生产通过环境变量接入真实服务商（ADR-0001 第 5 条）。
      # 变量名必须与代码读取的一致：glm 端口读 GLM_API_KEY（adapters/glm-llm.ts），
      # 摘要区可用性门控也读同一个名字（lib/llm-availability.ts）—— 曾误传 LLM_API_KEY，
      # 结果 .env 里填了 Key 也到不了容器。tests/unit/deploy-env-contract.test.mjs 钉死。
      LLM_PROVIDER: ${LLM_PROVIDER:-glm}
      # 预设服务商（默认智谱 GLM）
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_API_BASE: ${GLM_API_BASE:-}
      GLM_MODEL: ${GLM_MODEL:-}
      # 通用 OpenAI 兼容端点（LLM_PROVIDER=openai 时用：任何兼容端点，换模型不改代码）
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-}
      # 额外请求头（JSON；部分网关要求客户端带会话头，如 {"x-session-id":"…"}）
      LLM_EXTRA_HEADERS: ${LLM_EXTRA_HEADERS:-}
      MAILER_PROVIDER: smtp
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SEARCH_PROVIDER: meilisearch
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?必须在服务器 .env 中设置 MEILI_MASTER_KEY}
      # 管理后台令牌与告警收件邮箱（issue #12）
      SITE_URL: ${SITE_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      # 页脚 ICP 备案号（未配置时页脚显示占位文案）
      ICP_NUMBER: ${ICP_NUMBER:-}
      # 限流阈值（issue #52）：按客户端 IP 的固定窗口，单位「次/小时」；0 = 不限流。
      # 计数在进程内存里 —— 单实例部署有效，多副本时实际阈值会乘以副本数。
      SUBSCRIBE_RATE_LIMIT_PER_HOUR: ${SUBSCRIBE_RATE_LIMIT_PER_HOUR:-}
      ADMIN_LOGIN_RATE_LIMIT_PER_HOUR: ${ADMIN_LOGIN_RATE_LIMIT_PER_HOUR:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    # exec 让 node 直接成为容器 PID 1（issue #51）：`sh -c "... && npm run start"` 的
    # PID 1 是 sh，而非交互式 sh 不转发信号 —— docker stop / `compose up -d` 重建时
    # SIGTERM 到不了 node，只能在 stop_grace_period 后被 SIGKILL。
    command: sh -c "node scripts/db-migrate.mjs && exec npm run start"
    stop_grace_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_DRIVER: postgres
      DATABASE_URL: postgres://zhurenweng:${POSTGRES_PASSWORD:?必须在服务器 .env 中设置 POSTGRES_PASSWORD}@db:5432/zhurenweng
      LLM_PROVIDER: ${LLM_PROVIDER:-glm}
      # 预设服务商（默认智谱 GLM）
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_API_BASE: ${GLM_API_BASE:-}
      GLM_MODEL: ${GLM_MODEL:-}
      # 通用 OpenAI 兼容端点（LLM_PROVIDER=openai 时用：任何兼容端点，换模型不改代码）
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-}
      # 额外请求头（JSON；部分网关要求客户端带会话头，如 {"x-session-id":"…"}）
      LLM_EXTRA_HEADERS: ${LLM_EXTRA_HEADERS:-}
      MAILER_PROVIDER: smtp
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SEARCH_PROVIDER: meilisearch
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?必须在服务器 .env 中设置 MEILI_MASTER_KEY}
      # 任务失败告警收件邮箱（issue #12；未配置则不发告警）
      APP_BASE_URL: ${APP_BASE_URL:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      # 调度间隔：默认每日一轮（86_400_000ms）。worker 代码内默认 60s 只适合本地，
      # 生产若沿用会把政府站点敲成每分钟一次，极易被限流封 IP。
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-86400000}
      # 附件抽取（issue #57）让一轮可能比从前长：单个文件最坏是「探测 + 4MiB 整档 +
      # 解析」几十秒。每个文件处理完整立刻写终态，所以被 SIGKILL 最多丢一个在途文件 ——
      # 停止等待给到 60s（stop_grace_period 仍留一倍余量）就够。
      WORKER_STOP_WAIT_MS: ${WORKER_STOP_WAIT_MS:-60000}
      # 单次抓取请求的总预算（毫秒，issue #58）。慢源按源在适配器里声明
      # （src/sources/adapters/npc.ts 的 fetch.timeoutMs），这里只兜全局缺省。
      CRAWL_TIMEOUT_MS: ${CRAWL_TIMEOUT_MS:-}
      # 新公示通知的回看窗口（天，issue #60）：只有这段时间内首次收录的条目才会进汇总信
      NOTIFY_LOOKBACK_DAYS: ${NOTIFY_LOOKBACK_DAYS:-}
      # 附件条文读取（issue #57）：off / shadow / on。数值项留空即按代码缺省，
      # 所以这里只传空值占位——「填了就生效」必须是真话（契约由
      # tests/unit/deploy-env-contract.test.mjs 守）。
      # on = 摘要把附件条文当第二路输入（第 5 步已接线）；要退回「只解析不喂摘要」填 shadow。
      ATTACHMENT_TEXT: ${ATTACHMENT_TEXT:-on}
      ATTACHMENT_EXCLUDE_SOURCES: ${ATTACHMENT_EXCLUDE_SOURCES:-npc}
      ATTACHMENT_MAX_FILES_PER_ROUND: ${ATTACHMENT_MAX_FILES_PER_ROUND:-}
      ATTACHMENT_ROUND_BUDGET_MS: ${ATTACHMENT_ROUND_BUDGET_MS:-}
      ATTACHMENT_HOST_INTERVAL_MS: ${ATTACHMENT_HOST_INTERVAL_MS:-}
      ATTACHMENT_HOST_BLOCK_TRIP: ${ATTACHMENT_HOST_BLOCK_TRIP:-}
      ATTACHMENT_BLOCKED_RETRY_DAYS: ${ATTACHMENT_BLOCKED_RETRY_DAYS:-}
      ATTACHMENT_REFRESH_DAYS: ${ATTACHMENT_REFRESH_DAYS:-}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-}
    depends_on:
      db:
        condition: service_healthy
    # 直接 exec node（等价于 `npm run worker`，见 package.json）而不是经 npm：
    # 少一层进程，SIGTERM 直达 worker 的信号处理器（issue #51）。
    command: sh -c "node scripts/db-migrate.mjs && exec node worker/index.ts"
    # 一轮抓取是分钟级：给足在途轮次收尾的时间（worker 自己最多等
    # WORKER_STOP_WAIT_MS=60s，这里留一倍余量），避免抓到一半被 SIGKILL。
    stop_grace_period: 150s

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: zhurenweng
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须在服务器 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: zhurenweng
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhurenweng"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.13
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?必须在服务器 .env 中设置 MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data

volumes:
  db-data:
  meili-data:
  caddy-data:
  caddy-config:
