                        <div class="TRS_Editor"><p align="justify">　　为进一步规范运输机场运营许可管理，压实机场运营安全主体责任，保障运输机场安全、平稳运行，提升行业监管效能，中国民航局在征求有关单位意见的基础上，形成了《运输机场运营许可规定（征求意见稿）》，现向社会公开征求意见。公众可通过以下途径和方式提出反馈意见。</p>
<p>　　一、电子邮箱：jcsaqc@caac.gov.cn</p>
<p>　　二、通信地址：北京市东城区东四西大街155号民航局机场司（100710）</p>
<p>　　意见反馈截止日期为：{{CN_DATE+17}}&nbsp;&nbsp;</p>
<p>　　</p>
<p align="right">　　中国民航局</p>
<p align="right">　　2026年9月7日</p></div>
