# 生产对齐工件（docs/adr/0001-local-dev-without-docker.md）：
# caddy / web / worker / PostgreSQL / Meilisearch 五服务，与 PRD「部署」一致。
#
# 注意：开发机没有 Docker，本文件**在开发机上不可运行**，仅供生产部署对齐。
# 本地开发与测试使用 SQLite + stub（npm run dev / npm run e2e），见 README。
#
# 说明：web 与 worker 启动前都执行 scripts/db-migrate.mjs（drizzle 迁移按
# 迁移表幂等；并发启动由 src/db/client.ts 的 pg_advisory_lock 串行化）。
#
# 说明：对外流量一律经 caddy 终结 TLS（Let's Encrypt 自动签发/续期），web 只在
# 回环地址暴露 3000 供服务器本地排障；db / meilisearch 不对宿主暴露端口。

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      # 站点主域名（DNS A 记录须已指向本机，否则 ACME 校验失败）
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_DRIVER: postgres
      DATABASE_URL: postgres://zhurenweng:${POSTGRES_PASSWORD:-zhurenweng}@db:5432/zhurenweng
      # LLM 与邮件在生产通过环境变量接入真实服务商（ADR-0001 第 5 条）。
      # 变量名必须与代码读取的一致：glm 端口读 GLM_API_KEY（adapters/glm-llm.ts），
      # 摘要区可用性门控也读同一个名字（lib/llm-availability.ts）—— 曾误传 LLM_API_KEY，
      # 结果 .env 里填了 Key 也到不了容器。tests/unit/deploy-env-contract.test.mjs 钉死。
      LLM_PROVIDER: glm
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_API_BASE: ${GLM_API_BASE:-}
      GLM_MODEL: ${GLM_MODEL:-}
      MAILER_PROVIDER: smtp
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SEARCH_PROVIDER: meilisearch
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      # 管理后台令牌与告警收件邮箱（issue #12）
      SITE_URL: ${SITE_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      # 页脚 ICP 备案号（未配置时页脚显示占位文案）
      ICP_NUMBER: ${ICP_NUMBER:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    command: sh -c "node scripts/db-migrate.mjs && npm run start"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_DRIVER: postgres
      DATABASE_URL: postgres://zhurenweng:${POSTGRES_PASSWORD:-zhurenweng}@db:5432/zhurenweng
      LLM_PROVIDER: glm
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_API_BASE: ${GLM_API_BASE:-}
      GLM_MODEL: ${GLM_MODEL:-}
      MAILER_PROVIDER: smtp
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SEARCH_PROVIDER: meilisearch
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      # 任务失败告警收件邮箱（issue #12；未配置则不发告警）
      APP_BASE_URL: ${APP_BASE_URL:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      # 调度间隔：默认每日一轮（86_400_000ms）。worker 代码内默认 60s 只适合本地，
      # 生产若沿用会把政府站点敲成每分钟一次，极易被限流封 IP。
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-86400000}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node scripts/db-migrate.mjs && npm run worker"

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: zhurenweng
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhurenweng}
      POSTGRES_DB: zhurenweng
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhurenweng"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.13
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-zhurenweng-change-me}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data

volumes:
  db-data:
  meili-data:
  caddy-data:
  caddy-config:
