          <div class=TRS_Editor><p>　　为进一步完善律师制度，司法部起草了《中华人民共和国律师法（修订草案）》，现向社会公开征求意见。</p>
<p>　　一、登录中国政府法制信息网（www.moj.gov.cn），进入「立法意见征集」栏目提出意见。</p>
<p>　　二、通过电子邮件方式将意见发送至：lssf@moj.gov.cn。</p>
<p>　　征求意见时间为{{CN_DATE-3}}至{{DATE+4}}。</p></div>
