name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 需要单独验一次时**手动触发**，不要为了"让它跑起来"而造一次推送（2026-09-30 用户要求：
  # 不要高频使用 CI）。本地那套门比 CI 更全（多一条撤实现自证），所以 CI 是第二意见，不是主门。
  workflow_dispatch:

# 同一分支上后一次推送直接取消前一次还没跑完的 run。提交是**按批推**的，一批只该有一次 run；
# 没有这段的话，一天里连推几批就会把 runner 排满（2026-09-21 之前每次推送都各跑一次）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 这个 job 曾叫 Lint 却只跑单测：`npm run lint` 与类型检查**从未在 CI 里跑过**，
  # 唯一的类型门是 e2e job 里的 next build（issue #51 审计发现）。名字与内容现在对齐。
  lint:
    name: Lint & typecheck & unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # tsc 单跑一遍：next build 只覆盖被 App Router 触及的图，且它的报错混在构建日志里
      - run: npx tsc --noEmit
      - run: npm run test:unit

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run e2e
